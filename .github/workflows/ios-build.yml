# Compile l'IPA iOS sur un runner macOS de GitHub.
#
# Pourquoi ce workflow existe : le quota de builds iOS du plan EAS gratuit se
# consomme vite (il se réinitialise le 1er de chaque mois). `eas build --local`
# compile sur la machine qui exécute la commande et **ne consomme pas ce
# quota** ; le dépôt étant public, les runners macOS de GitHub sont gratuits et
# illimités. On a donc autant de builds qu'on veut.
#
# Le workflow s'arrête à l'IPA, déposé en artefact. L'envoi vers TestFlight se
# fait ensuite depuis un poste avec `eas submit --path`, pour ne pas avoir à
# stocker d'identifiants Apple dans les secrets du dépôt.
#
# Secret requis : EXPO_TOKEN — jeton d'accès personnel créé sur
# https://expo.dev/settings/access-tokens, qui permet à EAS de récupérer le
# certificat de distribution et le profil de provisionnement déjà enregistrés.

name: Build iOS

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Profil EAS
        required: true
        default: production
        type: choice
        options: [production, preview]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le projet
        run: npm run check

      - name: Installer EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Compiler l'IPA
        run: eas build --platform ios --profile ${{ inputs.profile }} --local --non-interactive --output ${{ github.workspace }}/DartCool.ipa

      - name: Déposer l'IPA en artefact
        uses: actions/upload-artifact@v4
        with:
          name: dartcool-ipa
          path: ${{ github.workspace }}/DartCool.ipa
          retention-days: 7
          if-no-files-found: error
